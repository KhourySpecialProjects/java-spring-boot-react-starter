# Deploy-like stack: built jar + nginx. `mise run stack:dev:up` runs this file alone.
# `mise run dev:up` merges compose.override.yaml on top for development.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-app}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: backend
      target: deploy
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-app}?user=${SERVICE_USER_POSTGRES:-app}&password=${SERVICE_PASSWORD_POSTGRES:-app}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: deploy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Alpine resolves localhost to IPv6 first, but nginx only listens on IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
