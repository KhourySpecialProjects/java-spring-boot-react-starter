server:
  port: ${PORT}
  # nginx sits in front of the backend and sets X-Forwarded-* headers.
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: app
  datasource:
    url: ${DATABASE_URL}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  api-docs:
    enabled: false
    path: /api/v1/openapi.json
  default-produces-media-type: application/json

logging:
  level:
    root: ${LOG_LEVEL}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(%logger{30}){cyan} %clr(:){faint} %m%n%wEx"
