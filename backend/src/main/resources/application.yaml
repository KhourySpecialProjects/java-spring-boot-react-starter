# Values in ${...} come from .env, which mise loads for local tasks and Docker
# Compose passes to the containers.
server:
  port: ${PORT:3000}
  # nginx sits in front of the backend and sets X-Forwarded-* headers.
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: app
  datasource:
    url: ${DATABASE_URL}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  default-produces-media-type: application/json

logging:
  level:
    root: ${LOG_LEVEL:info}
