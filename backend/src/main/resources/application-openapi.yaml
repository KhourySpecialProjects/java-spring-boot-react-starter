# Used only by `mise run contract`. Boots the app without a database so the
# OpenAPI spec can be exported anywhere, including CI and Docker builds.
server:
  port: 3999

spring:
  datasource:
    url: jdbc:postgresql://localhost/placeholder
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot.allow_jdbc_metadata_access: false

logging:
  level:
    root: info
